# Asset mapping the simulator memory map (docs/s7/LOCAL-SIMULATION.md) to two datasets:
#  - process: fast values to an MQTT topic every second
#  - identity: slow-changing values to the broker state store every 30 s
apiVersion: namespaces.deviceregistry.microsoft.com/v1
kind: Asset
metadata:
  name: s7-sim-asset
  namespace: azure-iot-operations
spec:
  uuid: 6c1f4a52-5c0e-4a3e-9d1b-2a7b9f0e0012
  attributes:
    assetType: s7-process-cell
  deviceRef:
    deviceName: s7-sim-device
    endpointName: s7-sim-endpoint
  # Defaults for every dataset of this asset
  defaultDatasetsConfiguration: '{"samplingIntervalMs": 1000}'
  datasets:
  - name: process
    datasetConfiguration: '{"samplingIntervalMs": 1000}'
    destinations:
    - target: Mqtt
      configuration:
        topic: s7/s7-sim-device/s7-sim-asset/process
        qos: Qos1
        retain: Never
        ttl: 3600
    dataPoints:
    - name: temperature
      dataSource: DB1.DBD0
      dataPointConfiguration: '{"dataType": "Real"}'
    - name: humidity
      dataSource: DB1.DBW4
      dataPointConfiguration: '{"dataType": "Int", "scale": 0.1}'
    - name: cycleCounter
      dataSource: DB1.DBD6
      dataPointConfiguration: '{"dataType": "DWord"}'
    - name: pressureDelta
      dataSource: DB1.DBW10
      dataPointConfiguration: '{"dataType": "Int"}'
    - name: running
      dataSource: DB1.DBX12.0
    - name: alarm
      dataSource: DB1.DBX12.1
    - name: tankLevelPercent
      dataSource: MW0
      dataPointConfiguration: '{"scale": 0.024420024420024}'
    - name: doorClosed
      dataSource: I0.0
    - name: emergencyStop
      dataSource: I0.1
    - name: pumpOn
      dataSource: Q0.0
    - name: valveOpen
      dataSource: Q0.1
  - name: identity
    datasetConfiguration: '{"samplingIntervalMs": 30000}'
    destinations:
    - target: BrokerStateStore
      configuration:
        key: s7-sim-asset-identity
    dataPoints:
    - name: serialNumber
      dataSource: DB1.DBB20
      dataPointConfiguration: '{"dataType": "String", "length": 16}'
    - name: totalEnergyKWh
      dataSource: DB1.DBB40
      dataPointConfiguration: '{"dataType": "LReal"}'
  version: 1
